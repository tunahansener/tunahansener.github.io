<style>
  :root{
    --navy-deep:#0A1A2E;
    --navy:#13273F;
    --gold:#C9A659;
    --gold-light:#E4CD8D;
    --cream:#F6F1E7;
    --ink:#1B1B1B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--navy-deep);
    color:var(--cream);
    line-height:1.7;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 6%;
  }
  .logo{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    color:var(--cream);
  }
  .logo span{color:var(--gold);}
  .back-link{
    color:var(--gold-light);
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border:1px solid var(--gold);
    padding:10px 20px;
    border-radius:4px;
    transition:background 0.3s;
  }
  .back-link:hover{background:var(--gold); color:var(--navy-deep);}
  main{padding:20px 6% 90px;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.8rem,4vw,2.6rem);
    text-align:center;
    margin:20px 0 50px;
    color:var(--cream);
  }
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:14px;
    max-width:1200px;
    margin:0 auto;
  }
  .gallery-slot{
    aspect-ratio:1/1;
    background:rgba(228,205,141,0.06);
    border:1.5px dashed var(--gold);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--gold-light);
    font-size:0.75rem;
    padding:8px;
  }
  .gallery-photo{
    aspect-ratio:1/1;
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    background:var(--navy);
  }
  .gallery-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.4s ease;
  }
  .gallery-photo:hover img{transform:scale(1.06);}

  /* Lightbox */
  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,26,46,0.94);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:5%;
  }
  .lightbox.active{display:flex;}
  .lightbox img{
    max-width:100%;
    max-height:90vh;
    border-radius:4px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox-close{
    position:absolute;
    top:24px; right:6%;
    color:var(--gold-light);
    font-size:2rem;
    cursor:pointer;
    line-height:1;
    background:none;
    border:none;
  }
  .lightbox-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    color:var(--gold-light);
    font-size:2.2rem;
    cursor:pointer;
    background:none;
    border:none;
    padding:10px 16px;
    user-select:none;
  }
  .lightbox-prev{left:2%;}
  .lightbox-next{right:2%;}
  .lightbox-nav:hover, .lightbox-close:hover{color:var(--gold);}
</style>
</head>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#10094;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightboxNext">&#10095;</button>
</div>

<script>
  const photos = Array.from(document.querySelectorAll('.gallery-photo'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let currentIndex = 0;

  function openLightbox(index){
    currentIndex = index;
    lightboxImg.src = photos[currentIndex].dataset.src;
    lightbox.classList.add('active');
  }
  function closeLightbox(){
    lightbox.classList.remove('active');
  }
  function showNext(){
    currentIndex = (currentIndex + 1) % photos.length;
    lightboxImg.src = photos[currentIndex].dataset.src;
  }
  function showPrev(){
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    lightboxImg.src = photos[currentIndex].dataset.src;
  }

  photos.forEach((photo, i) => {
    photo.addEventListener('click', () => openLightbox(i));
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxNext').addEventListener('click', showNext);
  document.getElementById('lightboxPrev').addEventListener('click', showPrev);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('active')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') showNext();
    if(e.key === 'ArrowLeft') showPrev();
  });
</script>
