<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hizmetlerimiz | Tunahan Sener Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0A1A2E;
    --navy:#13273F;
    --gold:#C9A659;
    --gold-light:#E4CD8D;
    --cream:#F6F1E7;
    --ink:#1B1B1B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--navy-deep);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 6%;
  }
  .logo{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    color:var(--cream);
  }
  .logo span{color:var(--gold);}
  .back-link{
    color:var(--gold-light);
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border:1px solid var(--gold);
    padding:10px 20px;
    border-radius:4px;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.8rem,4vw,2.6rem);
    color:var(--cream);
    margin-bottom:16px;
  }
  p{color:var(--gold-light); font-weight:300;}
</style>
</head>
<body>

<header>
  <div class="logo">Tunahan <span>Sener Park</span></div>
  <a href="index.html" class="back-link">Anasayfaya Dön</a>
</header>

<main>
  <div>
    <h1>Hizmetlerimiz</h1>
    <p>İçerik yakında eklenecek.</p>
  </div>
</main>

</body>
</html>
